<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Ubunye Papers</title>
<meta name="theme-color" content="#2f5d3a" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<div class="bar">
  <a href="index.html" aria-label="Back">&larr;</a>
  <b id="barTitle">Paper</b>

</div>
<div class="viewer">

  <a id="openBtn" class="open" target="_blank" rel="noopener" style="display:none">Open full screen</a>
</div>

<script src="lib.js"></script>
<script src="viewer.js"></script>
</body>
</html>
